<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamdan AI Widget</title><style>:root{--brand:#2563eb;--text:#101828;--muted:#667085;--line:#e4e7ec;--soft:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{height:100vh;display:flex;flex-direction:column}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900}.head strong{font-size:14px}.head span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.msgs{flex:1;overflow:auto;padding:14px;background:linear-gradient(#fff,var(--soft))}.msg{max-width:86%;padding:10px 12px;border-radius:14px;margin:8px 0;line-height:1.45;white-space:pre-wrap}.bot{background:#eef2f6}.user{background:var(--brand);color:#fff;margin-left:auto}.bar{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}.bar input{min-width:0;flex:1;border:1px solid #d0d5dd;border-radius:11px;padding:11px;outline:0}.bar button{border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:800;padding:0 15px}.tools{display:flex;gap:6px;padding:0 10px 8px;flex-wrap:wrap}.tool{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:12px}.lead{margin:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.lead h3{margin:0 0 8px;font-size:14px}.lead input,.lead textarea{width:100%;margin:5px 0;padding:9px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.lead textarea{min-height:65px}.lead button{width:100%;padding:10px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:800}.consent{font-size:11px;color:var(--muted);line-height:1.4}.status{font-size:11px;color:var(--muted);padding:0 12px 8px}@media(max-width:420px){.head{padding:12px}.bar{padding:8px}}</style></head><body><div class="app"><header class="head"><div class="logo">H</div><div><strong id="title">AI Assistant</strong><span>Ask a question or speak</span></div></header><main class="msgs" id="msgs"></main><div class="tools"><button class="tool" id="mic">🎤 Speak</button><button class="tool" id="read">🔊 Read last answer</button><button class="tool" id="leadBtn">📋 Contact me</button></div><div id="leadBox"></div><div class="status" id="status">Ready</div><form class="bar" id="form"><input id="input" autocomplete="off" placeholder="Ask a question…"><button>Send</button></form></div><script>const qs=new URLSearchParams(location.search);const businessId=qs.get('businessId')||'demo-business';const mode=qs.get('mode')==='real-estate'?'real-estate':'support';const msgs=document.getElementById('msgs'),input=document.getElementById('input'),status=document.getElementById('status');let history=[];let lastAnswer='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function add(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'bot');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}async function loadBusiness(){try{const r=await fetch('/api/business-public?businessId='+encodeURIComponent(businessId));if(r.ok){const d=await r.json();if(d.businessName)document.getElementById('title').textContent=d.businessName+' AI Assistant';}}catch(e){}}add('assistant',mode==='real-estate'?'Hello! I can help with property questions, buyer or seller requests, and agent handoff.':'Hello! I can answer questions using the business information and help you contact the business.');async function ask(text){history.push({role:'user',content:text});add('user',text);status.textContent='Thinking…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({businessId,messages:history,mode})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to answer.');lastAnswer=d.answer||'Sorry, I could not answer that.';history.push({role:'assistant',content:lastAnswer});add('assistant',lastAnswer);status.textContent=d.degraded?'Basic assistant mode':'Ready';}catch(e){add('assistant','Sorry, the assistant is temporarily unavailable. Please try again.');status.textContent='Connection problem';}}document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(v){input.value='';ask(v)}};document.getElementById('read').onclick=()=>{if(lastAnswer&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(lastAnswer))}};document.getElementById('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Voice input is not supported in this browser';return}const r=new SR();r.lang=navigator.language||'en-US';r.onstart=()=>status.textContent='Listening…';r.onresult=e=>{input.value=e.results[0][0].transcript;status.textContent='Ready'};r.onerror=()=>status.textContent='Voice input failed';r.start()};document.getElementById('leadBtn').onclick=()=>{document.getElementById('leadBox').innerHTML='<div class="lead"><h3>Contact the business</h3><input id="ln" placeholder="Your name"><input id="le" type="email" placeholder="Email"><input id="lp" placeholder="Phone"><textarea id="lr" placeholder="What do you need help with?"></textarea><label class="consent"><input id="lc" type="checkbox"> I agree to share these details with the business so they can contact me.</label><br><button id="sendLead">Submit request</button></div>';document.getElementById('sendLead').onclick=submitLead};async function submitLead(){const consent=document.getElementById('lc').checked;if(!consent){status.textContent='Please provide consent first';return}const body={businessId,name:document.getElementById('ln').value,email:document.getElementById('le').value,phone:document.getElementById('lp').value,request:document.getElementById('lr').value,industry:mode,preferredContact:'customer choice',consent:true};status.textContent='Submitting…';try{const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to submit');document.getElementById('leadBox').innerHTML='<div class="lead">✅ '+esc(d.message||'Request submitted successfully.')+'</div>';status.textContent='Request submitted';}catch(e){status.textContent=e.message}}loadBusiness();</script></body></html>
