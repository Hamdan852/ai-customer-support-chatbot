<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamdan AI — Sign in</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#101828;font-family:Inter,system-ui,sans-serif}.wrap{width:min(460px,calc(100% - 28px));margin:60px auto}.brand{text-align:center;margin-bottom:24px}.logo{margin:auto;width:52px;height:52px;border-radius:15px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{margin:12px 0 5px}.brand p{color:#667085;margin:0}.card{background:#fff;border:1px solid #e4e7ec;border-radius:20px;padding:24px}.tabs{display:flex;gap:6px;margin-bottom:20px}.tab{flex:1;padding:10px;border:1px solid #e4e7ec;background:#fff;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:#eff6ff;color:#175cd3;border-color:#bfd6ff}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:12px;font-weight:700}.field input,.field select{padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.status{margin:0 0 14px;padding:11px;border-radius:10px;font-size:13px;display:none}.status.show{display:block;background:#fef3f2;color:#b42318;border:1px solid #fecdca}.note{font-size:11px;color:#667085;line-height:1.5;margin-top:15px}.signupOnly{display:none}</style></head><body><main class="wrap"><div class="brand"><div class="logo">H</div><h1>Hamdan AI</h1><p>Business assistant platform</p></div><section class="card"><div class="tabs"><button class="tab active" id="loginTab">Sign in</button><button class="tab" id="signupTab">Create account</button></div><div id="status" class="status"></div><form id="form"><div class="signupOnly"><div class="field"><label>Business name</label><input id="business" autocomplete="organization" placeholder="Example Realty"></div></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@business.com"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password" minlength="10" placeholder="At least 10 characters"></div><button class="btn" id="submit">Sign in</button></form><p class="note">Your management session uses a secure HttpOnly cookie. Customer website widgets remain public and do not receive your dashboard credentials.</p></section></main><script>let signup=false;const tabL=document.getElementById('loginTab'),tabS=document.getElementById('signupTab'),form=document.getElementById('form'),status=document.getElementById('status'),submit=document.getElementById('submit'),business=document.getElementById('business');function setMode(v){signup=v;tabL.classList.toggle('active',!v);tabS.classList.toggle('active',v);document.querySelector('.signupOnly').style.display=v?'block':'none';submit.textContent=v?'Create account':'Sign in';business.required=v;document.getElementById('password').autocomplete=v?'new-password':'current-password';status.className='status'}tabL.onclick=()=>setMode(false);tabS.onclick=()=>setMode(true);async function check(){try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'me'})});if(r.ok) location.href='dashboard.html';}catch(e){}}form.onsubmit=async e=>{e.preventDefault();status.className='status';status.textContent='';const body={action:signup?'signup':'login',email:document.getElementById('email').value,password:document.getElementById('password').value};if(signup)body.businessName=business.value;submit.disabled=true;submit.textContent='Please wait…';try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed.');location.href='dashboard.html';}catch(err){status.textContent=err.message;status.className='status show';submit.disabled=false;submit.textContent=signup?'Create account':'Sign in'}};check();</script></body></html>
