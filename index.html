<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Hamdan AI business customer support assistant"><title>Hamdan AI Assistant</title>
<style>
:root{--bg:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--brand:#2563eb;--soft:#f2f4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}main{min-height:100dvh;display:flex;flex-direction:column}.top{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.badge{background:#eef4ff;color:#1d4ed8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.messages{flex:1;overflow:auto;padding:22px 18px 150px}.row{display:flex;margin:0 0 16px}.row.user{justify-content:flex-end}.bubble{max-width:88%;padding:14px 16px;border-radius:18px;font-size:16px;line-height:1.55;white-space:pre-wrap}.bot .bubble{background:var(--soft);border-bottom-left-radius:6px}.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:6px}.speak{border:0;background:transparent;cursor:pointer;font-size:15px;margin-left:6px}.quick{display:flex;gap:8px;overflow:auto;padding:0 18px 10px}.quick button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;color:#344054}.composer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}.input{display:flex;gap:8px;align-items:center;border:1px solid #cfd5df;border-radius:18px;padding:7px 7px 7px 14px;background:#fff}.input input{min-width:0;flex:1;border:0;outline:0;font:inherit;font-size:16px}.btn{border:0;cursor:pointer;border-radius:13px;height:48px}.mic{width:48px;background:#eef2f7;font-size:21px}.mic.active{background:#fee4e2}.send{padding:0 18px;background:var(--brand);color:#fff;font-weight:800;font-size:16px}.send:disabled{opacity:.55}.hint{text-align:center;color:#98a2b3;font-size:11px;margin-top:7px}@media(min-width:760px){main{max-width:900px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}.bubble{max-width:72%}.composer{left:50%;transform:translateX(-50%);width:min(900px,100%)}}
</style>
</head>
<body><main>
<header class="top"><div><div class="brand" id="brand">Hamdan AI Assistant</div><div class="sub">AI Customer Support • Text + Voice</div></div><span class="badge">ONLINE</span></header>
<section class="messages" id="messages" aria-live="polite"><div class="row bot"><div class="bubble" id="welcome">Hello! 👋 I’m Hamdan AI Assistant. How can I help you today?</div></div></section>
<nav class="quick" aria-label="Quick questions"><button data-q="What services do you provide?">Services</button><button data-q="What are your hours?">Hours</button><button data-q="How can I contact support?">Contact support</button></nav>
<form class="composer" id="form"><div class="input"><input id="input" maxlength="4000" autocomplete="off" placeholder="Ask a question..." aria-label="Ask a question"><button class="btn mic" id="mic" type="button" aria-label="Speak">🎤</button><button class="btn send" id="send" type="submit">Send</button></div><div class="hint" id="hint">Type your question or use the microphone • Answers can be read aloud</div></form>
</main>
<script>
const params=new URLSearchParams(location.search);const businessId=params.get('businessId')||'demo-business';const messages=document.getElementById('messages'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send'),mic=document.getElementById('mic'),hint=document.getElementById('hint'),welcome=document.getElementById('welcome'),brand=document.getElementById('brand');const history=[];let assistantName='Hamdan AI Assistant';
function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=navigator.language||'en-US';speechSynthesis.speak(u)}
function add(text,type){const row=document.createElement('div');row.className='row '+type;const b=document.createElement('div');b.className='bubble';b.textContent=text;if(type==='bot'&&'speechSynthesis'in window){const s=document.createElement('button');s.className='speak';s.type='button';s.textContent='🔊';s.title='Read answer aloud';s.onclick=()=>speak(text);b.appendChild(s)}row.appendChild(b);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
async function loadProfile(){try{const r=await fetch('/api/business-public?businessId='+encodeURIComponent(businessId),{headers:{Accept:'application/json'}});if(!r.ok)return;const d=await r.json();const n=String(d.assistantName||'').trim();assistantName=n||'Hamdan AI Assistant';brand.textContent=assistantName;welcome.textContent=`Hello! 👋 I’m ${assistantName}. How can I help you today?`;document.title=assistantName}catch(e){console.warn('Profile unavailable; keeping Hamdan AI Assistant fallback')}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang=navigator.language||'en-US';recognition.onstart=()=>{mic.classList.add('active');hint.textContent='Listening… speak now'};recognition.onend=()=>{mic.classList.remove('active');hint.textContent='Type your question or use the microphone • Answers can be read aloud'};recognition.onerror=()=>{mic.classList.remove('active');hint.textContent='Microphone permission or browser support is unavailable'};recognition.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};mic.onclick=()=>{try{recognition.start()}catch(e){}}}else{mic.disabled=true;hint.textContent='Text input available • Voice input is not supported by this browser'}
async function sendMessage(text){const value=(text||input.value).trim();if(!value||send.disabled)return;add(value,'user');history.push({role:'user',content:value});input.value='';send.disabled=true;send.textContent='Thinking…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({businessId,messages:history,mode:'support'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'The AI service is unavailable.');const answer=String(d.answer||'I’m sorry, I could not generate an answer.');add(answer,'bot');history.push({role:'assistant',content:answer})}catch(e){add(`I’m Hamdan AI Assistant. I’m temporarily unable to reach the AI service. ${e.message}`,'bot')}finally{send.disabled=false;send.textContent='Send';input.focus()}}
form.onsubmit=e=>{e.preventDefault();sendMessage()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.q));loadProfile();
</script></body></html>
